name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    name: Dashboard / lint, typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.20.0
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  dotnet-cross-platform:
    name: .NET API + agent / restore, build, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Moniter.sln
      - run: dotnet format Moniter.sln --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet build Moniter.sln --no-restore --configuration Release
      - run: dotnet test Moniter.sln --no-build --configuration Release --logger "console;verbosity=normal"
      - run: dotnet restore Moniter.sln
      - run: dotnet list src/Moniter.Api/Moniter.Api.csproj package --vulnerable --include-transitive
      - run: dotnet list src/Moniter.Agent/Moniter.Agent.csproj package --vulnerable --include-transitive
      - run: dotnet list tests/Moniter.Api.Tests/Moniter.Api.Tests.csproj package --vulnerable --include-transitive
      - run: dotnet list tests/Moniter.Agent.Tests/Moniter.Agent.Tests.csproj package --vulnerable --include-transitive
  windows-agent:
    name: Windows agent / Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Moniter.Agent.Tests/Moniter.Agent.Tests.csproj
      - run: dotnet build src/Moniter.Agent/Moniter.Agent.csproj --no-restore --configuration Release
      - run: dotnet test tests/Moniter.Agent.Tests/Moniter.Agent.Tests.csproj --configuration Release --logger "console;verbosity=normal"
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan checked-out files (not shallow Git history)
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: dir --redact --exit-code=2 .
