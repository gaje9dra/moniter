name: Recover verified pnpm lockfile

on:
  push:
    branches:
      - recovery/phase-0-7-lockfile

permissions:
  actions: read
  contents: write

concurrency:
  group: moniter-lockfile-recovery
  cancel-in-progress: false

jobs:
  recover-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/phase-0-7-lockfile
          fetch-depth: 0
          persist-credentials: true

      - name: Download original verified artifact
        uses: actions/download-artifact@v4
        with:
          repository: gaje9dra/moniter
          run-id: 40159780444
          artifact-ids: 12586430553
          github-token: ${{ github.token }}
          path: artifact

      - name: Verify artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("artifact/pnpm-lock.yaml")
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(f"Recovered file: {p}")
          print(f"Byte length: {len(data)}")
          print(f"SHA-256: {digest}")
          expected_size = 140815
          expected_hash = "64a4c74ced662cdef6a412c9c381f71bdd63f6445453a675c7ed7bf9aafdc5d6"
          if len(data) != expected_size:
              raise SystemExit(f"Expected {expected_size} bytes, got {len(data)}")
          if digest != expected_hash:
              raise SystemExit(f"SHA-256 mismatch: expected {expected_hash}, got {digest}")
          if b"lockfileVersion: '9.0'" not in data or b"importers:" not in data:
              raise SystemExit("Lockfile structure marker missing")
          PY

      - name: Check target branch head and commit verified lockfile
        shell: bash
        env:
          TARGET_BRANCH: feat/phase-1-foundation
          EXPECTED_HEAD: 2f151bac7508f2077d4d82daa4bdccc5f56dee7d
        run: |
          set -euo pipefail
          cp artifact/pnpm-lock.yaml /tmp/pnpm-lock.yaml
          git fetch origin "$TARGET_BRANCH"
          actual_head="$(git rev-parse FETCH_HEAD)"
          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::Target branch moved. Expected $EXPECTED_HEAD but found $actual_head. Refusing to overwrite changes."
            exit 1
          fi

          git switch --detach "$actual_head"
          mkdir -p apps/dashboard
          cp /tmp/pnpm-lock.yaml apps/dashboard/pnpm-lock.yaml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("apps/dashboard/pnpm-lock.yaml")
          data = p.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(f"Staged lockfile bytes: {len(data)}")
          print(f"Staged lockfile SHA-256: {digest}")
          assert len(data) == 140815
          assert digest == "64a4c74ced662cdef6a412c9c381f71bdd63f6445453a675c7ed7bf9aafdc5d6"
          PY

          git add apps/dashboard/pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(dashboard): restore complete pnpm lockfile"
          git push origin HEAD:refs/heads/"$TARGET_BRANCH"

      - name: Verify remote lockfile and report commit
        shell: bash
        env:
          TARGET_BRANCH: feat/phase-1-foundation
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          remote_blob="$(git rev-parse FETCH_HEAD:apps/dashboard/pnpm-lock.yaml)"
          echo "Remote branch head: $remote_head"
          echo "Remote lockfile blob: $remote_blob"
          git show FETCH_HEAD:apps/dashboard/pnpm-lock.yaml > /tmp/remote-pnpm-lock.yaml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path("/tmp/remote-pnpm-lock.yaml").read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(f"Remote lockfile bytes: {len(data)}")
          print(f"Remote lockfile SHA-256: {digest}")
          assert len(data) == 140815
          assert digest == "64a4c74ced662cdef6a412c9c381f71bdd63f6445453a675c7ed7bf9aafdc5d6"
          PY

      - name: Remove temporary recovery workflow from recovery branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin recovery/phase-0-7-lockfile
          git switch -C recovery/phase-0-7-lockfile FETCH_HEAD
          git rm .github/workflows/recover-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time lockfile recovery workflow"
          git push origin HEAD:refs/heads/recovery/phase-0-7-lockfile
